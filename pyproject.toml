[project]
name = "learning-companion"
version = "0.0.1"
description = "P0 capability probes and shared contracts"
requires-python = ">=3.12,<3.15"
dependencies = ["jsonschema[format]==4.26.0"]

[project.optional-dependencies]
backend = ["fastapi==0.141.1", "uvicorn==0.54.0", "psycopg[binary]==3.3.6"]

[dependency-groups]
dev = ["pytest==9.0.2", "openapi-spec-validator==0.9.0"]
backend-test = ["httpx==0.28.1"]

[tool.pytest.ini_options]
testpaths = ["packages/contracts/tests", "services/api/tests", "services/worker", "tests/evals", "tests/e2e"]
pythonpath = ["."]
