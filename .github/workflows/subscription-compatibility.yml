name: Subscription macOS metadata compatibility

on:
  workflow_dispatch:
    inputs:
      expected_source_sha:
        description: Full reviewed main commit to measure (must equal this run's SHA)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: subscription-macos-metadata
  cancel-in-progress: false

jobs:
  metadata:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Check pinned official CLI metadata in fresh product state
        timeout-minutes: 4
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
        run: >-
          python tests/probes/support/codex_macos_metadata.py
          --source-sha "$EXPECTED_SOURCE_SHA"
          --output "$RUNNER_TEMP/subscription-macos-metadata.json"
      - name: Retain sanitized compatibility receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: subscription-macos-metadata-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/subscription-macos-metadata.json
          if-no-files-found: error
          retention-days: 14
