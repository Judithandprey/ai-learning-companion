name: Desktop build and package

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-2025
          - platform: macos
            runner: macos-26
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      PYTHON: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: matrix.platform == 'windows'
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Check and package exact desktop source
        env:
          DESKTOP_PLATFORM: ${{ matrix.platform }}
        run: bash scripts/desktop-checks.sh "$DESKTOP_PLATFORM" "$RUNNER_TEMP/desktop-evidence"
      - name: Upload available source, checks and development artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-${{ matrix.platform }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/desktop-evidence/*
            !${{ runner.temp }}/desktop-evidence/work/**
          if-no-files-found: error
          retention-days: 14
