name: P0 checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Python ${{ matrix.python-version }} / Node 24.21.0
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.14']
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # Compatibility tests compare bytes with a historical baseline.

      - name: Set up Python
        id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.19'
          enable-cache: false

      - name: Install locked Python dependencies
        env:
          UV_PYTHON: ${{ steps.python.outputs.python-path }}
          UV_PYTHON_DOWNLOADS: never
        run: uv sync --frozen --extra backend --group backend-test

      - name: Install locked Node.js dependencies
        run: npm ci --ignore-scripts

      - name: Load pinned native fixture regression inputs
        run: |
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import tempfile
          import zipfile

          archive = Path("docs/verification/lead/native-raw-ingress-hosted/raw-frame-ingress-fixtures.zip")
          expected = "57b0f80b495305e7acd04e7f989679f3de5f890002c50fd6100aa7b4746279dd"
          if hashlib.sha256(archive.read_bytes()).hexdigest() != expected:
              raise SystemExit("Pinned native fixture archive changed; review its provenance before updating the pin")
          destination = Path(tempfile.mkdtemp(prefix="native-regression-", dir=os.environ["RUNNER_TEMP"]))
          # This exact hash-pinned archive contains only the reviewed 48 native fixture files.
          with zipfile.ZipFile(archive) as bundle:
              bundle.extractall(destination)
          fixtures = destination / "raw-frame-ingress-fixtures"
          if not fixtures.is_dir():
              raise SystemExit("Pinned native fixture directory is missing")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write(f"QA_NATIVE_FIXTURES={fixtures}\n")
          print("Enabled native-fixture regressions; no new native/device/provider execution")
          PY

      - name: Check contracts, backend, learning, QA, and web probe
        run: bash scripts/check.sh
