name: iPad transparent window experiment
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: window-overlay-probe-${{ github.ref }}
  cancel-in-progress: false
jobs:
  probe:
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build and launch the two independent experimental apps
        env:
          PROBE_OUT: ${{ runner.temp }}/window-probe-evidence
          PROBE_BUILD: ${{ runner.temp }}/window-probe-derived
        run: bash experiments/ipad-window-overlay-probe/ci/build.sh
      - name: Package exact source
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/window-probe-evidence"
          git archive --format=zip --prefix=WindowOverlayProbe/ \
            --output="$RUNNER_TEMP/window-probe-evidence/WindowOverlayProbe-source.zip" \
            HEAD:experiments/ipad-window-overlay-probe
          printf 'commit=%s\nrun=%s/%s/actions/runs/%s\n' \
            "$(git rev-parse HEAD)" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" \
            > "$RUNNER_TEMP/window-probe-evidence/revision.txt"
      - name: Retain only source, binaries, logs and smoke evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: window-overlay-probe-${{ github.sha }}
          path: |
            ${{ runner.temp }}/window-probe-evidence/*.ipa
            ${{ runner.temp }}/window-probe-evidence/*.zip
            ${{ runner.temp }}/window-probe-evidence/*.txt
            ${{ runner.temp }}/window-probe-evidence/*.log
            ${{ runner.temp }}/window-probe-evidence/*.json
            ${{ runner.temp }}/window-probe-evidence/*.png
          if-no-files-found: error
          retention-days: 14
