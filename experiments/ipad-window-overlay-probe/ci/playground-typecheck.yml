name: Playground source compiler check
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: window-overlay-probe-${{ github.ref }}
  cancel-in-progress: false
jobs:
  typecheck:
    runs-on: macos-26
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Compare old and revised exact Playground source
        env:
          PROBE_OUT: ${{ runner.temp }}/playground-check
        run: python3 experiments/ipad-window-overlay-probe/ci/playground_typecheck.py
      - name: Retain compiler evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playground-typecheck-${{ github.sha }}
          path: ${{ runner.temp }}/playground-check/
          if-no-files-found: error
          retention-days: 14
