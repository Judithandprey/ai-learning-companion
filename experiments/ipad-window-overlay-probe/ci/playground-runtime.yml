name: Playground exact-source simulator runtime
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: window-overlay-probe-${{ github.ref }}
  cancel-in-progress: false
jobs:
  runtime:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Launch exact R2 baseline and verify R3 startup plus canvas controls
        env:
          PROBE_OUT: ${{ runner.temp }}/playground-runtime-evidence
          PROBE_BUILD: ${{ runner.temp }}/playground-runtime-build
        run: python3 experiments/ipad-window-overlay-probe/ci/playground_runtime.py
      - name: Retain screenshots, exact source hashes, test results and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playground-runtime-${{ github.sha }}
          path: ${{ runner.temp }}/playground-runtime-evidence/
          if-no-files-found: error
          retention-days: 14
