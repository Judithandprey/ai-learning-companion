<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src data:; media-src mediastream: blob:">
<title>Learning Companion overlay</title>
<link rel="stylesheet" href="overlay.css">
</head>
<body>
<canvas id="ink" aria-hidden="true"></canvas>
<div id="toolbar" class="toolbar" role="toolbar" aria-label="Learning companion">
  <button type="button" id="toolbarHandle" class="handle" aria-label="Move the toolbar: drag, or use the arrow keys; Home puts it back">⠿</button>
  <button type="button" data-mode="NAV" aria-label="Navigate: clicks go to your apps">✋</button>
  <button type="button" data-mode="ASK" aria-label="Ask: circle something on the screen">?</button>
  <button type="button" data-mode="WRITE" aria-label="Write: notes over the screen">✎</button>
  <span id="tools" class="tools" role="group" aria-label="Writing tools">
    <button type="button" id="pen" aria-label="Pen">✎</button>
    <button type="button" id="eraser" aria-label="Eraser: erases only what it passes over">⌫</button>
    <button type="button" id="mouse" class="text">Mouse</button>
    <button type="button" id="undo" aria-label="Undo">↶</button>
    <button type="button" id="redo" aria-label="Redo">↷</button>
    <button type="button" id="placement" aria-label="Placement of new ink">▣</button>
  </span>
  <button type="button" id="cancel" class="text" hidden>Cancel</button>
  <span id="hint" class="hint"></span>
</div>
<section id="card" class="card" role="region" aria-label="Selection and response" hidden>
  <div class="cardBar">
    <button type="button" id="cardHandle" class="handle" aria-label="Move this card: drag, or use the arrow keys; Home puts it back">⠿</button>
    <span id="talkControls" class="talk" role="group" aria-label="Reading responses aloud" hidden>
      <button type="button" id="talk" aria-pressed="false">Talk</button>
      <button type="button" id="mute" aria-pressed="false" hidden>Mute</button>
      <button type="button" id="slower" aria-label="Read more slowly" hidden>−</button>
      <span id="rate" hidden></span>
      <button type="button" id="faster" aria-label="Read faster" hidden>+</button>
      <button type="button" id="interrupt" hidden>Stop reading</button>
    </span>
    <button type="button" id="close" class="close" aria-label="Close">×</button>
  </div>
  <p id="talkStatus" class="text" role="status" hidden></p>
  <p id="badge" class="badge">Selection · no AI connected</p>
  <img id="crop" alt="The selected region with your ink, from the captured frame">
  <p id="cardText" class="text"></p>
  <div id="askForm" class="ask" hidden>
    <label for="question">Your question about this selection</label>
    <textarea id="question" rows="3" maxlength="4000"></textarea>
    <div class="assist" role="radiogroup" aria-label="How much help you want">
      <label><input type="radio" name="assistance" value="hint" checked> A hint</label>
      <label><input type="radio" name="assistance" value="explain"> Explain it</label>
      <label><input type="radio" name="assistance" value="full_solution"> Full solution</label>
    </div>
    <div class="actions">
      <button type="button" id="askSubmit">Ask ChatGPT</button>
      <button type="button" id="askCancel" hidden>Cancel</button>
    </div>
  </div>
  <p id="askStatus" class="text" role="status" hidden></p>
  <button type="button" id="askSave" hidden>Save this outcome on this device</button>
  <div id="answerBox" class="answer" hidden>
    <p class="badge">Answer from ChatGPT · generated text, apart from your selection</p>
    <p id="answer" class="text"></p>
  </div>
</section>
<script type="module" src="overlay.js"></script>
</body>
</html>
