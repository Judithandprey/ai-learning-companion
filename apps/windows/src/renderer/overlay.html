<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src data:; media-src mediastream: blob:">
<title>Learning Companion overlay</title>
<link rel="stylesheet" href="overlay.css">
</head>
<body>
<canvas id="ink" aria-hidden="true"></canvas>
<div id="toolbar" class="toolbar" role="toolbar" aria-label="Learning companion">
  <button type="button" data-mode="NAV" aria-label="Navigate: clicks go to your apps">✋</button>
  <button type="button" data-mode="ASK" aria-label="Ask: circle something on the screen">?</button>
  <button type="button" data-mode="WRITE" aria-label="Write: notes over the screen">✎</button>
  <span id="tools" class="tools" role="group" aria-label="Writing tools">
    <button type="button" id="pen" aria-label="Pen">✎</button>
    <button type="button" id="eraser" aria-label="Eraser: erases only what it passes over">⌫</button>
    <button type="button" id="mouse" class="text">Mouse</button>
    <button type="button" id="undo" aria-label="Undo">↶</button>
    <button type="button" id="redo" aria-label="Redo">↷</button>
    <button type="button" id="placement" aria-label="Placement of new ink">▣</button>
  </span>
  <button type="button" id="cancel" class="text" hidden>Cancel</button>
  <span id="hint" class="hint"></span>
</div>
<section id="card" class="card" role="region" aria-label="Selection" hidden>
  <button type="button" id="close" class="close" aria-label="Close">×</button>
  <p class="badge">Selection · no AI connected</p>
  <img id="crop" alt="The selected region with your ink, from the captured frame">
  <p id="cardText" class="text"></p>
</section>
<script type="module" src="overlay.js"></script>
</body>
</html>
